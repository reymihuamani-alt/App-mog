name: APK de Android

on:
  push:
    branches: ["ccr-790cea80-rk7up3", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Generar proyecto Android
        run: npm run android:prepare

      # Siempre la misma firma: así cada APK nuevo se instala encima del anterior sin borrar tus datos.
      - name: Usar firma fija
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mog-apk
          path: mog.apk

      # Publica el APK en un enlace fijo: .../releases/download/apk/mog.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk mog.apk \
            --title "Mog para Android" \
            --notes "Última versión de Mog ($(date -u +'%Y-%m-%d %H:%M') UTC, commit ${GITHUB_SHA::7}). Descarga mog.apk e instálalo." \
            --target "$GITHUB_SHA" --latest
